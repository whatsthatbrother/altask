# Builds the Windows installer and publishes a GitHub release whenever VERSION
# in Tasks.pyw changes on main (no tag needed - the release creates tag vX.Y).
# Installed copies of AlTask read releases/latest/download/latest.json and
# offer the update to the user.
name: Build & release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: v
        shell: python
        run: |
          import os, re, sys
          vs = {f: re.search(r'^VERSION = "([^"]+)"', open(f, encoding="utf-8").read(), re.M).group(1)
                for f in ("Tasks.pyw", "Setup.pyw")}
          if len(set(vs.values())) != 1:
              sys.exit(f"VERSION mismatch: {vs}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"version={vs['Tasks.pyw']}\n")

      - name: Already released?
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "v${{ steps.v.outputs.version }} already published - nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PyInstaller
        if: steps.exists.outputs.skip == 'false'
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build
        if: steps.exists.outputs.skip == 'false'
        run: python build.py

      - name: Write latest.json
        if: steps.exists.outputs.skip == 'false'
        run: python tools.py manifest

      - name: Publish release v${{ steps.v.outputs.version }}
        if: steps.exists.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AlTask ${{ steps.v.outputs.version }}
          body_path: notes.txt
          make_latest: true
          files: |
            dist/AlTask-Setup.exe
            dist/latest.json
